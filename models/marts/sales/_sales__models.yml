version: 2

models:
  - name: fct_order_lines
    description: >
      Order line item fact table for the Superstore dataset, with light
      business logic (shipping lead time, profit margin, profitability
      flag) layered on top of staging. One row per `order_line_id`.
    columns:
      - name: order_line_id
        description: "Primary key of this fact table."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Order this line belongs to."
        data_tests:
          - not_null
      - name: order_date
        description: "Date the order was placed."
      - name: ship_date
        description: "Date the order shipped."
      - name: days_to_ship
        description: "Number of days between `order_date` and `ship_date`."
      - name: ship_mode
        description: "Shipping method used."
      - name: customer_id
        description: "Identifier of the customer who placed the order."
        data_tests:
          - not_null
      - name: customer_name
        description: "Name of the customer who placed the order."
      - name: segment
        description: "Customer segment."
      - name: country_region
        description: "Country/region the order shipped to."
      - name: city
        description: "City the order shipped to."
      - name: state_province
        description: "State/province the order shipped to."
      - name: postal_code
        description: "Postal code the order shipped to."
      - name: region
        description: "Sales region."
      - name: product_id
        description: "Identifier of the product sold on this line."
        data_tests:
          - not_null
      - name: product_name
        description: "Name of the product sold on this line."
      - name: category
        description: "Top-level product category."
      - name: sub_category
        description: "Product sub-category."
      - name: quantity
        description: "Units sold on this line item."
      - name: discount
        description: "Discount applied to this line item, as a fraction."
      - name: sales
        description: "Gross sales amount for this line item, in USD."
      - name: profit
        description: "Profit for this line item, in USD. Can be negative."
      - name: profit_margin
        description: "`profit / sales`, computed safely (0 when `sales` is 0)."
      - name: is_profitable
        description: "True when `profit` is positive."
