version: 2

models:
  - name: stg_my_source__my_table
    description: >
      Staged, lightly-cleaned records from `my_source.my_table`. One row per
      `my_table_id`. No business logic here -- renaming/casting only.
    columns:
      - name: my_table_id
        description: "Primary key of this staging model."
        data_tests:
          - unique
          - not_null
      - name: status_raw
        description: "Untransformed status code, as it appears in the source."
      - name: created_at
        description: "When the record was created in the source system."
      - name: updated_at
        description: "When the record was last updated in the source system."
