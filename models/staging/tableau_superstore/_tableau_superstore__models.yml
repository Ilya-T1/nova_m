version: 2

models:
  - name: stg_tableau_superstore__orders
    description: >
      Staged order line items from the Superstore dataset, renamed to
      snake_case with no other transformation. One row per `order_line_id`.
    columns:
      - name: order_line_id
        description: "Primary key of this staging model (source `Row ID`)."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Order this line belongs to. Not unique -- one order can have multiple lines."
        data_tests:
          - not_null
      - name: order_date
        description: "Date the order was placed."
      - name: ship_date
        description: "Date the order shipped."
      - name: ship_mode
        description: "Shipping method used."
        data_tests:
          - accepted_values:
              values: ['First Class', 'Same Day', 'Second Class', 'Standard Class']
      - name: customer_id
        description: "Identifier of the customer who placed the order."
        data_tests:
          - not_null
      - name: customer_name
        description: "Name of the customer who placed the order."
      - name: segment
        description: "Customer segment."
        data_tests:
          - accepted_values:
              values: ['Consumer', 'Corporate', 'Home Office']
      - name: country_region
        description: "Country/region the order shipped to."
      - name: city
        description: "City the order shipped to."
      - name: state_province
        description: "State/province the order shipped to."
      - name: postal_code
        description: "Postal code the order shipped to."
      - name: region
        description: "Sales region."
        data_tests:
          - accepted_values:
              values: ['Central', 'East', 'South', 'West']
      - name: product_id
        description: "Identifier of the product sold on this line."
        data_tests:
          - not_null
      - name: category
        description: "Top-level product category."
        data_tests:
          - accepted_values:
              values: ['Furniture', 'Office Supplies', 'Technology']
      - name: sub_category
        description: "Product sub-category."
      - name: product_name
        description: "Name of the product sold on this line."
      - name: sales
        description: "Gross sales amount for this line item, in USD."
        data_tests:
          - not_null
      - name: quantity
        description: "Units sold on this line item."
        data_tests:
          - not_null
      - name: discount
        description: "Discount applied to this line item, as a fraction."
      - name: profit
        description: "Profit for this line item, in USD. Can be negative."
