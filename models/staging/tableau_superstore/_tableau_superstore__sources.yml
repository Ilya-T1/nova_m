version: 2

sources:
  - name: tableau_superstore
    database: data_analytics_platform
    schema: tableau_superstore
    description: >
      Tableau's "Sample Superstore" retail sales dataset -- one row per
      order line item (a product within an order).

    # The underlying table name contains spaces/mixed case, so it must be
    # quoted exactly as stored rather than folded to upper-case.
    quoting:
      database: false
      schema: false
      identifier: true

    tables:
      - name: orders
        identifier: "Sample Superstore 2023"
        description: >
          Order line items from 2020-01 through 2023-12. Grain: one row per
          `Row ID` (a single product line within an order; a multi-item
          order spans multiple rows sharing the same `Order ID`).
        columns:
          - name: Row ID
            description: "Surrogate key for the order line item. Unique per row."
            data_tests:
              - unique
              - not_null
          - name: Order ID
            description: "Identifier shared by all line items in the same order."
            data_tests:
              - not_null
          - name: Order Date
            description: "Date the order was placed."
          - name: Ship Date
            description: "Date the order shipped."
          - name: Ship Mode
            description: "Shipping method (e.g. Standard Class, Same Day)."
          - name: Customer ID
            description: "Identifier of the customer who placed the order."
          - name: Customer Name
            description: "Name of the customer who placed the order."
          - name: SEGMENT
            description: "Customer segment (Consumer, Corporate, Home Office)."
          - name: Country/Region
            description: "Country/region the order shipped to."
          - name: CITY
            description: "City the order shipped to."
          - name: State/Province
            description: "State/province the order shipped to."
          - name: Postal Code
            description: "Postal code the order shipped to."
          - name: REGION
            description: "Sales region (Central, East, South, West)."
          - name: Product ID
            description: "Identifier of the product sold on this line."
          - name: CATEGORY
            description: "Top-level product category."
          - name: Sub-Category
            description: "Product sub-category."
          - name: Product Name
            description: "Name of the product sold on this line."
          - name: SALES
            description: "Gross sales amount for this line item, in USD."
          - name: QUANTITY
            description: "Units sold on this line item."
          - name: DISCOUNT
            description: "Discount applied to this line item, as a fraction (e.g. 0.20 = 20%)."
          - name: PROFIT
            description: "Profit for this line item, in USD. Can be negative."
